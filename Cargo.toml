[package]
name = "address-explorer"
version = "0.1.0"
authors = ["emidev98 <eharastasan@gmail.com>"]
edition = "2021"
default-run = "address-explorer"

[workspace]
members = ["crates/core", "crates/web-worker", "tools/cargo-prepare"]

[patch.crates-io]
sqlite-wasm-vfs = { path = "vendor/sqlite-wasm-vfs" }

[dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl", "backup", "serialize"], optional = true}
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
bitcoin = { version = "0.32", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
address-explorer-core = { path = "crates/core", optional = true }
dioxus-fullstack-core = { version = "0.7.10", default-features = false }
base64 = "0.22"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1"
tower-http = { version = "0.6", features = ["cors"], optional = true }

# Client-side-only helpers (the date picker's "today" comes from the
# browser clock; `SystemTime` panics on wasm32).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.72"
web-sys = { version = "0.3.106", features = [
    "Window",
    "SharedWorker",
    "MessageEvent",
    "ErrorEvent",
    "MessagePort",
    "Storage",
    "Location",
    "Navigator",
    "StorageManager",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "Document",
    "Element",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "File",
    "Event",
    "EventTarget",
] }
tokio = { version = "1", features = ["sync"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"
dirs = "6"
tokio = { version = "1", features = ["rt", "time"], optional = true }

[features]
default = ["web"]
web = ["dioxus/web", "web-client"]
# Native builds are always all-in-one: local backend plus the optional
# runtime-selectable remote backend.
desktop = ["dioxus/desktop", "server", "remote-backend"]
mobile = ["dioxus/mobile", "server", "remote-backend"]
server = ["dioxus/server", "dioxus/fullstack", "dep:rusqlite", "dep:bitcoin", "dep:tower-http"]
# Internal feature enabled by every native build. It gates the remote helper,
# runtime forwarding, native remote version checks, and the Backend settings
# section. The server-side version middleware is compiled with `server`.
remote-backend = ["dep:tokio"]
# The browser PWA: worker RPC plus a full-URL remote HTTP client.
web-client = ["dep:tokio", "dep:address-explorer-core"]

[build-dependencies]
wasm-bindgen-cli-support = "=0.2.129"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
