name: Contributors ledger

# Rebuilds the generated table in CONTRIBUTORS.md from merged pull requests and
# opens a pull request with the result. Manual on purpose: the ledger is a
# release-time artifact, not a source of commit noise.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild the ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/update-contributors.mjs

      - name: Open a pull request when the ledger changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CONTRIBUTORS.md; then
            echo "Contributors ledger is already current."
            exit 0
          fi
          branch="chore/contributors-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add CONTRIBUTORS.md
          git commit -m "chore: refresh the contributor ledger"
          git push origin "$branch"
          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --title "chore: refresh the contributor ledger" \
            --body "Regenerated by the **Contributors ledger** workflow. \`CONTRIBUTORS.md\` is a frozen path, so this pull request is expected to need the \`maintainer-override\` label." \
            --label chore || true
