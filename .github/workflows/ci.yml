name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental artifacts help local rebuilds and only bloat a clean CI cache.
  CARGO_INCREMENTAL: 0

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      # `dx fmt` is intentionally not gated: Dioxus CLI 0.7.10 is not
      # idempotent on several existing handlers, and its global --check
      # reports generated files outside the tracked source.
      - run: cargo fmt --all --check

  checks:
    name: Compile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: dx check --platform web
      - run: dx check --platform desktop
      - run: dx check --fullstack

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: cargo test -p address-explorer --no-default-features --features server
      - run: cargo test -p address-explorer --no-default-features --features desktop

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: cargo clippy -p address-explorer --all-targets --no-default-features --features server -- -D warnings
      - run: cargo clippy -p address-explorer --all-targets --no-default-features --features desktop -- -D warnings
      - run: cargo clippy -p address-explorer --target wasm32-unknown-unknown --no-default-features --features web -- -D warnings
      - run: cargo clippy -p address-explorer-web-worker --target wasm32-unknown-unknown -- -D warnings

  web-build:
    name: Web release build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: dx build --web --release --locked
      - name: Verify the stylesheet is generated, not committed
        run: |
          set -euo pipefail

          if [ -e assets/tailwind.css ] || [ -n "$(git ls-files -- assets/tailwind.css)" ]; then
            echo "assets/tailwind.css must not exist or be tracked; the stylesheet is generated into Cargo's OUT_DIR." >&2
            exit 1
          fi

          css="$(grep -rl --include='*.css' -- '--md-sys-color-primary' \
            target/dx/address-explorer/release/web/public || true)"
          if [ -z "$css" ]; then
            echo "No compiled stylesheet in the web build output." >&2
            find target -name 'tailwind.css*' -printf '%s %p\n' >&2 || true
            ls -l target >&2 || true
            exit 1
          fi
          if ! grep -q -- 'md3-app-shell' "$css"; then
            echo "The compiled stylesheet is missing application classes: $css" >&2
            exit 1
          fi
          printf 'Compiled stylesheet: %s (%s bytes)\n' "$css" "$(wc -c < "$css")"

  desktop-cross:
    # The release workflow bundles desktop apps on macOS and Windows, so a
    # regression there must fail a pull request instead of a tag.
    name: Desktop build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macOS arm64
          - runner: windows-2022
            platform: Windows x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          github-env: "false"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Build desktop binary
        run: cargo build --release --locked --no-default-features --features desktop
