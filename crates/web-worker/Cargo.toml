[package]
name = "address-explorer-web-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["server"]
# The worker compiles the same backend modules as the native server. Reusing
# the `server` cfg keeps validation and repository helpers available without
# duplicating them.
server = ["dep:bitcoin"]

[dependencies]
address-explorer-core = { path = "../core" }
base64 = "0.22"
bitcoin = { version = "0.32", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
js-sys = "0.3"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-wasm-rs = "0.5.5"
sqlite-wasm-vfs = "0.2.0"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.72"
web-sys = { version = "0.3.106", features = [
    "console",
    "MessageEvent",
    "MessagePort",
    "SharedWorkerGlobalScope",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "StorageManager",
    "Event",
    "EventTarget",
] }
